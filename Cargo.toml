[package]
name = "asset-resolver"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[features]
default = ["casc"]
casc = [
  "dep:cascette-client-storage",
  "dep:cascette-crypto",
  "dep:cascette-formats",
]

[dependencies]
binrw = "0.15.1"
rusqlite = { version = "0.35", features = ["bundled"] }
tokio = { version = "1", features = ["rt"] }
cascette-client-storage = { git = "https://github.com/Osso/cascette-rs", rev = "19f4deada9530d289ba472f0d11debd2aa4c999a", features = ["local-install"], optional = true }
cascette-crypto = { git = "https://github.com/Osso/cascette-rs", rev = "19f4deada9530d289ba472f0d11debd2aa4c999a", optional = true }
cascette-formats = { git = "https://github.com/Osso/cascette-rs", rev = "19f4deada9530d289ba472f0d11debd2aa4c999a", optional = true }

[[bin]]
name = "casc-local"
path = "src/bin/casc_local.rs"
required-features = ["casc"]

[[bin]]
name = "casc_refresh"
path = "src/bin/casc_refresh.rs"
required-features = ["casc"]
